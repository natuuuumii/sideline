<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>BTC SIDELINE【音担さん用】</title>
  <link rel="icon" type="image/png" href="images/favicon.jpeg" />
  <link rel="apple-touch-icon" href="images/favicon.jpeg" />
  <style>
    :root {
      --bg: #f0f8ff;
      --btn: #3d6aad;
      --btn-alt: #71b4c7;
      --btn-alt2: #74c4c0;
      --btn-text: #fff;
      --playing: #d1ecf1;
      --border: rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; }

    body {
      font-family: Arial, system-ui, -apple-system, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 16px;
      color: #123;
    }

    .page-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .home-link { color: #3d6aad; text-decoration: none; font-weight: bold; }
    .home-link:hover { text-decoration: underline; }

    h3 { text-align: center; margin: 10px 0 16px; }

    #currentTrack { text-align: center; margin: 10px 0 6px; font-size: 15px; }

    audio { display: block; width: min(760px, 94vw); margin: 8px auto 18px; }

    /* グリッド: 端末に関係なく常に8×8 */
    .grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 8px;
      width: min(820px, 96vw);
      margin: 0 auto;
    }
    /* ボタンを小画面で潰れにくくする微調整（任意） */
    .sound-btn {
    appearance: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fff;        /* ← 白背景に */
    color: #111;             /* ← 黒文字に */
    padding: clamp(6px, 1vw, 10px) clamp(4px, 0.8vw, 8px);
    min-height: clamp(36px, 5vw, 48px);
    font-size: clamp(10px, 1.6vw, 14px);
    line-height: 1.2;
    cursor: pointer;
    transition: transform .04s ease, opacity .2s ease, box-shadow .2s ease, background .2s ease;
    word-break: break-word;
    }
    .sound-btn:hover { opacity: .92; }
    .sound-btn:active { transform: translateY(1px); }
    /* alt/alt2 は色替え不要なら無効化してOK（残しても実害なし） */
    .sound-btn.alt, .sound-btn.alt2 { background: #fff; }

    /* 再生中の見た目（白地でも見えるように） */
    .sound-btn.playing {
    outline: 3px solid var(--playing);
    box-shadow: 0 0 0 2px #fff inset;
    }

    /* 未割り当ては薄グレー背景にして区別 */
.sound-btn[disabled] {
  background: #f3f4f6;
  color: #999;
  cursor: not-allowed;
  opacity: 1;              /* ← くすませすぎない */
  filter: none;
}

    .legend { width: min(820px, 96vw); margin: 14px auto 0; font-size: 12px; color: #456; }
    .legend code { background: #fff; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <header class="page-header">

  </header>

    { label: "OD攻守交代/ACDC,", src: "music/ターンオーバー(O_Dスタ)AC_DC.mp3", textColor: "black," },
    { label: "Oｽﾀ①,", src: "music/Oスタ①.mp3", textColor: "red," },

    { label: "Maroon,", src: "music/Oダンス_MAROON5.mp3", textColor: "red," },

    { label: "Dｽﾀ/HOT,", src: "music/Dスタート_HOT.mp3", textColor: "blue," },
    { label: "Dｽﾀ/dirty,", src: "music/Dスタート_Dirty.mp3", textColor: "blue," },
    { label: "Chap,", src: "music/Dダンス_Chap.mp3", textColor: "blue," },
    { label: "Power,", src: "music/Dダンス_Power.mp3", textColor: "blue," },
    { label: "Move,", src: "music/Dダンス_Move.mp3", textColor: "blue," },
    { label: "Tambourine,", src: "music/Dダンス_Tambourine.mp3", textColor: "blue," },
    { label: "Bon Jovi,", src: "music/Dダンス_BONJOVI.mp3", textColor: "blue," },
    { label: "Dalla Dalla,", src: "music/Dダンス_DallaDalla.mp3", textColor: "blue," },
    { label: "Antiflagile,", src: "music/Dダンス_Antiflagile.mp3", textColor: "blue," },
    { label: "【ｺ】20世紀,", src: "music/Dコール_20世紀少年.mp3", textColor: "blue," },
    { label: "【ｺ】ｱﾍﾞﾝｼﾞｬｰｽ,", src: "music/Dコール_アベンジャーズ.mp3", textColor: "blue," },
    { label: "【ｺ】Clap,", src: "music/Dコール_clap.mp3", textColor: "blue," },

    { label: "【ｺ】ｼﾞｮｼﾞｮ,", src: "music/Dコール_ジョジョ.mp3", textColor: "blue," },
    { label: "【ｺ】Samurai,", src: "music/Dコール_Samurai.mp3", textColor: "blue," },
    { label: "【ｺ】Narco,", src: "music/Dコール_Narco.mp3", textColor: "blue," },
    { label: "【ｺ】Winter,", src: "music/Dコール_Winter.mp3", textColor: "blue," },
    { label: "【ｺ】ﾏﾂｹﾝ,", src: "music/Dコール_マツケンEDM.mp3", textColor: "blue," },
    { label: "ｷｯｸｵﾌ/Joker,", src: "music/★キックオフ_Joker.mp3", textColor: "black," },
    { label: "ｷｯｸｵﾌ/Rage,", src: "music/★キックオフ_Rage.mp3", textColor: "black," },
    { label: "相手TD/Another Level,", src: "music/相手TD_AnotherLevel.mp3", textColor: "black," },
    { label: "相手TD/Breakout,", src: "music/相手TD_Breakout.mp3", textColor: "black," },
    { label: "相手FG/Gamechanger,", src: "music/相手FG_Gamechanger.mp3", textColor: "black," },
    { label: "相手FG/Turnitup,", src: "music/相手FG_Turnitup.mp3", textColor: "black," },
    { label: "OP,", src: "music/◆Opening(DITA)2025.mp3", textColor: "black," },
    { label: "ｺｲﾝﾄｽ,", src: "music/◆コイントス.mp3", textColor: "black," },
    { label: "前半QT,", src: "music/0509QT_選手紹介.mp3", textColor: "black," },
    { label: "後半QT,", src: "music/【スポンサー紹介③】JanetJackson.mp3", textColor: "black," },
    { label: "ｲﾅﾂﾞﾏ,", src: "music/☆オハコ_イナズマダンス(2026).mp3", textColor: "black," },
    { label: "ﾊｰﾌ,", src: "music/◆2026春ハーフ〜BTダンス_v02.mp3", textColor: "black," },
    { label: "[試合後]Dreamers,", src: "music/試合終了_Dreamers.mp3", textColor: "black," },
    { label: "ﾌﾘｱﾋﾟ,", src: "music/FA(O)_Head&Heart.mp3", textColor: "black," }
  ];

  // 64個に満たない場合は未割り当てスロットで埋める
  while (tracks.length < 64) {
    const idx = tracks.length + 1;
    tracks.push({ label: `未割り当て ${idx}`, src: "" });
  }

  // --- UI生成 --------------------------------------------------------------
  const grid = document.getElementById('grid');
  const audio = document.getElementById('audioPlayer');
  const currentLabel = document.getElementById('currentTrack');

  let currentIdx = -1;

  function renderButtons() {
    grid.innerHTML = '';

    tracks.forEach((t, i) => {
      const btn = document.createElement('button');
      btn.className = 'sound-btn';

      // 2,3列目だけ色替えなど好みで（視認性UP）
      if (i % 8 === 1) btn.classList.add('alt');
      if (i % 8 === 2) btn.classList.add('alt2');

      btn.id = `btn-${i}`;
      btn.type = 'button';
      btn.setAttribute('aria-label', t.label || `ボタン ${i+1}`);
      btn.textContent = t.label || `ボタン ${i+1}`;
      
    /* ★ここを追加：特定ボタンの文字色上書き ★ */
    if (t.textColor) {
      btn.style.color = t.textColor;    // "red" / "blue" / "#hex" でもOK
      // 文字色を変えたボタンは視認性のためボーダーも少し濃く
      btn.style.borderColor = 'rgba(0,0,0,0.18)';
      // もし背景も薄く色味つけたいなら ↓ を有効化
      // btn.style.background = t.textColor === 'red' ? '#fff5f5' : '#f5f8ff';
    }
    
      if (!t.src) {
        btn.disabled = true;
        btn.title = '未割り当て';
      } else {
        btn.addEventListener('click', () => playIndex(i));
      }

      grid.appendChild(btn);
    });
  }

  function playIndex(i) {
    const track = tracks[i];
    if (!track || !track.src) return;

    // 再生中ハイライトのリセット
    if (currentIdx >= 0) {
      const prev = document.getElementById(`btn-${currentIdx}`);
      prev && prev.classList.remove('playing');
    }

    currentIdx = i;

    audio.src = track.src;
    audio.play().catch(err => {
      console.error('再生エラー:', err);
    });

    const nowBtn = document.getElementById(`btn-${i}`);
    nowBtn && nowBtn.classList.add('playing');

    const fileName = decodeURIComponent(track.src.split('/').pop());
    currentLabel.textContent = `再生中: ${fileName}`;
  }

  // 曲が終わったらハイライトを外す（またはそのままでもOK）
  audio.addEventListener('ended', () => {
    const nowBtn = document.getElementById(`btn-${currentIdx}`);
    nowBtn && nowBtn.classList.remove('playing');
    currentIdx = -1;
    currentLabel.textContent = '再生中: なし';
  });

  // 初期化
  renderButtons();
</script>
</body>
</html>
